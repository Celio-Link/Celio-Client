<div [class.opacity-100]="active" class="transition-opacity opacity-0 duration-500 ease-in-out">
  <div [class.opacity-100]="active" class="transition-opacity opacity-0 duration-500 ease-in-out">
    <div class="box relative">

      <div *ngIf="state | isCurrentlyInState : SessionState.Start" class="flex flex-col sm:flex-row w-full min-h-[5rem] h-auto sm:h-[5rem] py-2 pb-10 sm:py-0 sm:pb-0">
        <div class="card rounded-box grid grow place-items-center">
          <button type="button" (click)="enterSession()" class="btn btn-lg whitespace-nowrap">Create<span class="hidden sm:inline"> Session</span></button>
        </div>
        <div class="divider sm:divider-horizontal"><div class="font-Gen3 text-4xl">OR</div></div>
        <div class="card rounded-box grid grow place-items-center">
          <div class="join w-full max-w-xs sm:w-3xs">
            <input
              type="text"
              enterkeyhint="go"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Enter Session Id"
              class="input input-lg join-item min-w-0 flex-1 font-Gen3 text-2xl"
              [value]="joinSessionId"
              (input)="onJoinSessionIdInput($event)"
              (compositionend)="onJoinSessionIdInput($event)"
              (keydown.enter)="joinSession()" />
            <button type="button" (click)="joinSession()" [disabled]="!joinSessionId.trim()" class="btn btn-lg join-item shrink-0">Join</button>
          </div>
        </div>
      </div>

      <div *ngIf="state | hasReachedState : SessionState.Waiting" class="flex w-full h-[5rem]">
        <div class="font-Gen3 text-4xl">
          Connected to Session: <br>
          {{sessionId}}
          <button type="button" (click)="copySessionId()" class="btn text-2xl btn-sm">Copy</button>
        </div>
      </div>
      <button *ngIf="state | hasReachedState : SessionState.Waiting" type="button" (click)="leaveSession()" class="btn btn-sm text-2xl absolute bottom-3 right-2">Leave Session</button>
      <img *ngIf="state | isCurrentlyInState : SessionState.Start" src="assets/down_arrow.png" class="animate-bob pointer-events-none absolute bottom-3 right-2 w-6 h-6 image-pixelated" />

    </div>
    <div class="divider"></div>
  </div>

  <div [class.opacity-100]="state | hasReachedState : SessionState.Waiting" class="transition-opacity opacity-0 duration-500 ease-in-out">
    <div class="box relative">
      <div *ngIf="state | isCurrentlyInState : SessionState.Waiting" class="flex w-full h-[5rem]">
        <p class="font-Gen3 text-4xl waiting">
          Waiting for Partner<span class="dots"></span>
        </p>
      </div>
      <div *ngIf="state | hasReachedState : SessionState.Commit" class="flex w-full h-[5rem]">
        <p class="font-Gen3 text-4xl waiting">
          Waiting for Partner... <br>
          Partner has connected!
        </p>
      </div>
    </div>
    <div class="divider"></div>
  </div>
</div>
